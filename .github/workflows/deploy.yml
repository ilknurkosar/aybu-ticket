name: Deploy Backend to Cloud Run

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Run database migrations
        run: npm --prefix backend run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
      - name: Seed admin and demo event
        run: npm --prefix backend run seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push backend image
        run: |
          IMAGE=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/aybu-ticket/backend:${{ github.sha }}
          docker build -t $IMAGE ./backend
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy Cloud Run service
        env:
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_FULL_NAME: ${{ secrets.ADMIN_FULL_NAME }}
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USERNAME: ${{ secrets.GRAFANA_LOKI_USERNAME }}
          GRAFANA_LOKI_PASSWORD: ${{ secrets.GRAFANA_LOKI_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VERIFICATION_EMAIL_FROM: ${{ secrets.VERIFICATION_EMAIL_FROM }}
        run: |
          gcloud run deploy aybu-ticket-backend \
            --image $IMAGE \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --timeout 60 \
            --set-env-vars "NODE_ENV=production,CLIENT_URL=${CLIENT_URL},DATABASE_URL=${DATABASE_URL},REDIS_URL=${REDIS_URL},REDIS_TOKEN=${REDIS_TOKEN},JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET},JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET},LOCK_TTL_SECONDS=300,ALLOWED_EMAIL_DOMAIN=@aybu.edu.tr,DATABASE_SSL=true,ADMIN_EMAIL=${ADMIN_EMAIL},ADMIN_FULL_NAME=${ADMIN_FULL_NAME},GRAFANA_LOKI_URL=${GRAFANA_LOKI_URL},GRAFANA_LOKI_USERNAME=${GRAFANA_LOKI_USERNAME},GRAFANA_LOKI_PASSWORD=${GRAFANA_LOKI_PASSWORD},SMTP_HOST=${SMTP_HOST},SMTP_PORT=${SMTP_PORT},SMTP_USER=${SMTP_USER},SMTP_PASS=${SMTP_PASS},VERIFICATION_EMAIL_FROM=${VERIFICATION_EMAIL_FROM}"
      - name: Provision Grafana dashboard
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
          GRAFANA_DASHBOARD_FOLDER_UID: ${{ secrets.GRAFANA_DASHBOARD_FOLDER_UID }}
        run: node monitoring/create-grafana-dashboard.js
      - name: Provision Grafana alerts
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
          GRAFANA_PROMETHEUS_UID: ${{ secrets.GRAFANA_PROMETHEUS_UID }}
          GRAFANA_ALERT_EMAIL: ${{ secrets.GRAFANA_ALERT_EMAIL }}
        run: node monitoring/create-grafana-alerts.js
